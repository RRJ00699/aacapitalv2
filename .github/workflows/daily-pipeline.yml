name: AACapital D1 daily pipeline

on:
  schedule:
    # 08:15 IST == 02:45 UTC, weekdays.
    - cron: '45 2 * * 1-5'
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many active IPOs to process'
        required: false
        default: '10'
      max_rhps:
        description: 'Maximum new RHP Sonnet extractions'
        required: false
        default: '4'
      max_sbi:
        description: 'Maximum new SBI Sonnet extractions'
        required: false
        default: '8'
      dry_run:
        description: 'No D1/R2 writes and no paid model calls'
        type: boolean
        default: false

concurrency:
  # A second paid run must wait rather than race the exact-document spend guard.
  group: aacapital-d1-daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt boto3 pymupdf rapidfuzz playwright curl_cffi
          # SEBI and SBI acquisition are now first-class scheduled lanes.
          python -m playwright install --with-deps chromium

      - name: Run D1 production pipeline
        env:
          # One authenticated write seam. No DATABASE_URL and no direct D1 credentials.
          D1_INGEST_URL:                 ${{ secrets.D1_INGEST_URL }}
          D1_INGEST_AUTH_SECRET:         ${{ secrets.D1_INGEST_AUTH_SECRET }}

          # Immutable retained documents: RHP + SBI only. Anchor PDF is transient.
          R2_ACCOUNT_ID:                 ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:              ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:          ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_DOCUMENT_BUCKET:            ${{ secrets.R2_DOCUMENT_BUCKET }}

          # Paid extraction. Existing exact-document/model/prompt spend guard remains mandatory.
          ANTHROPIC_API_KEY:              ${{ secrets.ANTHROPIC_API_KEY }}
          SBI_SONNET_OWNER_APPROVED:      'YES'
          SBI_SONNET_INPUT_USD_PER_MTOK:  ${{ secrets.SBI_SONNET_INPUT_USD_PER_MTOK }}
          SBI_SONNET_OUTPUT_USD_PER_MTOK: ${{ secrets.SBI_SONNET_OUTPUT_USD_PER_MTOK }}
          SBI_SONNET_OUTPUT_CAP:          ${{ secrets.SBI_SONNET_OUTPUT_CAP }}
          SBI_SONNET_RUN_CAP_USD:         ${{ secrets.SBI_SONNET_RUN_CAP_USD }}

          # Kite credentials stay inside Cloudflare; runner receives proxy auth only.
          KITE_BROKER_PROXY_URL:          ${{ secrets.KITE_BROKER_PROXY_URL }}
          KITE_BROKER_PROXY_AUTH_SECRET:  ${{ secrets.KITE_BROKER_PROXY_AUTH_SECRET }}

          # Public application is KV-only; every applied run republishes snapshots last.
          SNAPSHOT_PUBLISH_URL:            ${{ secrets.SNAPSHOT_PUBLISH_URL }}
          SNAPSHOT_PUBLISH_KEY:            ${{ secrets.SNAPSHOT_PUBLISH_KEY }}
        run: |
          MODE="--apply"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then MODE=""; fi
          python pipeline/d1_cron.py $MODE \
            --limit "${{ github.event.inputs.limit || '10' }}" \
            --max-rhps "${{ github.event.inputs.max_rhps || '4' }}" \
            --max-sbi "${{ github.event.inputs.max_sbi || '8' }}"

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-daily-pipeline-${{ github.run_number }}
          path: |
            download_manifest.json
          retention-days: 14
          if-no-files-found: ignore
