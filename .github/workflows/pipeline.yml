name: AACapital pipeline

# Twice daily, Indian hours. Data arrives progressively, so the SAME IPO is processed
# on every run and each pass fills whatever has newly become available. Every writer is
# COALESCE-empty-only or keyed ON CONFLICT — re-running is the design, not a risk.
on:
  schedule:
    - cron: '30 2 * * 1-5'    # 08:00 IST — pre-market
    - cron: '30 12 * * 1-5'   # 18:00 IST — post-close
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many IPOs to process'
        required: false
        default: '10'
      skip_download:
        description: 'Skip the RHP/SBI download step'
        type: boolean
        default: false

concurrency:
  # Never let two runs touch the DB at once — the writers are idempotent but a
  # half-finished paid extraction racing a second run wastes money.
  group: aacapital-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write        # required so the run can commit SBI notes back
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary curl_cffi pymupdf kiteconnect pyotp requests python-dotenv \
                      playwright pdfplumber rapidfuzz
          python -m playwright install --with-deps chromium

      - name: Run pipeline
        env:
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KITE_API_KEY:      ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET:   ${{ secrets.KITE_API_SECRET }}
          KITE_USER_ID:      ${{ secrets.KITE_USER_ID }}
          KITE_PASSWORD:     ${{ secrets.KITE_PASSWORD }}
          KITE_TOTP_SECRET:  ${{ secrets.KITE_TOTP_SECRET }}
          NTFY_TOPIC:        ${{ secrets.NTFY_TOPIC }}
        run: |
          python cron.py --run \
            --limit ${{ github.event.inputs.limit || '10' }} \
            --max-rhps 4 \
            --purge-pdfs \
            ${{ github.event.inputs.skip_download == 'true' && '--skip-download' || '' }}

      # DOCUMENT LIFECYCLES DIFFER, DELIBERATELY:
      #   RHPs (8-20MB)  -> extracted, then PURGED. Never committed: git keeps every blob
      #                     forever, so committing one is permanent weight a later delete
      #                     never reclaims. Re-fetchable via documents.url.
      #   SBI notes (~3p) -> KEPT and committed back, because the UI displays them and an
      #                     Actions runner is ephemeral. cron.py detects GITHUB_ACTIONS and
      #                     commits only data/research_notes; on the laptop it commits
      #                     nothing and the files simply stay put.

      # The daily $ cap lives in platform_config.daily_spend_cap_usd, NOT here — so it
      # can be changed from a phone with any DB client, with no redeploy and no commit.

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_number }}
          path: |
            drive_manifest.json
            rhp_v2full/*_summary.json
          retention-days: 14
          if-no-files-found: ignore
