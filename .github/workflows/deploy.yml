# .github/workflows/deploy.yml — mobile-first deploys.
# Merging a PR to main (from the GitHub phone app) IS a production deploy.
# Manual redeploy: GitHub app -> Actions -> Deploy -> Run workflow.
# Secrets required (repo Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  (dash.cloudflare.com -> profile -> API Tokens ->
#                          Create -> "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID (dashboard right sidebar of any zone page)
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: deploy-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx opennextjs-cloudflare build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
