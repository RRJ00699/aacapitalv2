name: Listing preopen capture
on:
  schedule:
    # GitHub cron is UTC. Service itself enforces 08:55-10:05 IST and weekdays.
    - cron: "*/5 3,4 * * 1-5"
  workflow_dispatch: {}
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary kiteconnect
      - name: Capture Kite preopen book into listing_observations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
        run: python capture_preopen.py
        working-directory: pipeline
