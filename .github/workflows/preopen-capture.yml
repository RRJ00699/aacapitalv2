name: Listing preopen capture
# Owner approval is required before adding the proposed weekday schedule.
# Proposed IST: every 5m, 08:55–10:05 (Mon–Fri); owner equivalents: 22:25–23:35 CST
# on the prior day or 23:25–00:35 CDT. Maximum 75 lightweight checks/week.
on:
  workflow_dispatch:
    inputs:
      limit: { description: "Maximum listing IPOs", default: "5", required: false }
      dry_run: { description: "Select ISINs without Kite/DB writes", type: boolean, default: true }
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary kiteconnect
      - name: Eligibility check and bounded capture
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
        working-directory: pipeline
        run: python capture_preopen.py --limit '${{ inputs.limit }}' ${{ inputs.dry_run && '--dry-run' || '' }} --retries 2
