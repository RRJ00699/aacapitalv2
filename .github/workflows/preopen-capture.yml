name: Listing preopen capture
# Enabled for listing-day pre-open capture only. UTC cron lines cover 08:55–10:05 IST
# on weekdays; capture_preopen.py still enforces the IST window and fast-exits when
# no listing-day IPO exists. Maximum 5 IPOs per run.
on:
  schedule:
    - cron: "25-55/5 3 * * 1-5"
    - cron: "0-35/5 4 * * 1-5"
  workflow_dispatch:
    inputs:
      limit: { description: "Maximum listing IPOs", default: "5", required: false }
      dry_run: { description: "Select ISINs without Kite/DB writes", type: boolean, default: false }
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary kiteconnect
      - name: Eligibility check and bounded capture
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
        working-directory: pipeline
        run: python capture_preopen.py --limit '${{ github.event.inputs.limit || '5' }}' ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} --retries 2
