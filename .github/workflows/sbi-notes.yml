name: SBI IPO Notes (daily scrape + load)
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install playwright pdfplumber rapidfuzz psycopg2-binary --break-system-packages
          python -m playwright install --with-deps chromium
      - name: Download SBI notes to ephemeral workspace
        run: python _scripts/download_sbi_notes.py --out "$RUNNER_TEMP/sbi-notes"
      - name: Prepare bounded local inventory (no Neon, R2, or paid model calls)
        run: python pipeline/sbi_migration_verify.py --dry-run --directory "$RUNNER_TEMP/sbi-notes"
      # Real ledger/R2 ingest and Sonnet extraction remain explicit owner checkpoints.
      # The scheduled workflow must never turn an implementation/test run into writes.
      - name: Remove ephemeral PDFs
        if: always()
        run: rm -rf "$RUNNER_TEMP/sbi-notes"
