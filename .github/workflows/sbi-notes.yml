name: SBI IPO Notes (daily scrape + load)
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install playwright pdfplumber rapidfuzz psycopg2-binary --break-system-packages
          python -m playwright install --with-deps chromium
      - name: Download SBI notes
        run: python _scripts/download_sbi_notes.py --out data/research_notes
      - name: Parse + write DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python _scripts/parse_sbi_notes.py --dir data/research_notes --write-db
      - name: Commit new PDFs
        run: |
          git config user.name "sbi-notes-bot"
          git config user.email "bot@aacapital"
          git add data/research_notes || true
          git commit -m "SBI notes auto-scrape" || echo "nothing new"
          git push || echo "no push"
