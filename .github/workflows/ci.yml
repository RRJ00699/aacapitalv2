# .github/workflows/ci.yml — MANDATORY merge gate (Pillar 1).
# Every PR must pass: type-check, lint, python tests, secret scan, dep audit.
# Branch protection (Settings→Branches) should require this before merge.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build with database variables absent
        run: env -u DATABASE_URL -u NEON_DATABASE_URL npx next build
      # Route runtime tier (A1/A2/A3) + admin auth-gating (B7) need node_modules,
      # so they run HERE — in the python job they would skip loudly.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: python -m pytest _scripts/tests/test_route_runtime.py _scripts/tests/test_auth_gating.py -q
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest pytest-cov pgserver psycopg2-binary curl_cffi openpyxl anthropic pymupdf pdfplumber requests pandas lxml
      # SUBPROC_COV wraps subprocess integration tests in coverage; --cov (no
      # arg) defers to .coveragerc so the CORE denominator stays honest.
      - run: SUBPROC_COV=1 python -m pytest _scripts/tests/ -q --cov --cov-report=term
      - name: Canonical pipeline tests
        run: python -m pytest pipeline -q
      - name: Compile-check all scripts
        run: python -m py_compile _scripts/*.py _scripts/ipo/*.py
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dependency audit (high+) with a documented allowlist
        run: |
          # KNOWN, ACCEPTED — @auth/core advisories from next-auth v5 BETA. We are mid-
          # migration; a beta bump to chase these risks the auth work that just landed, so
          # they are allowlisted HERE (not by lowering --audit-level). Revisit and remove
          # when next-auth reaches STABLE, or by 2026-11-01 — whichever is first.
          #   GHSA-xmf8-cvqr-rfgj  getToken() uncaught exception on malformed headers
          #   GHSA-7rqj-j65f-68wh  email homoglyph @ bypass
          ALLOW="GHSA-xmf8-cvqr-rfgj GHSA-7rqj-j65f-68wh"
          audit=$(npm audit --omit=dev --audit-level=high --json || true)
          ids=$(printf '%s' "$audit" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s||"{}");const o=[];
            for(const k in (a.vulnerabilities||{})){const v=a.vulnerabilities[k];
              if(["high","critical"].includes(v.severity))for(const x of (v.via||[]))if(x&&x.url)o.push(x.url.split("/").pop());}
            console.log([...new Set(o)].join("\n"));});')
          bad=""; for id in $ids; do echo "$ALLOW" | grep -qw "$id" || bad="$bad $id"; done
          if [ -n "$bad" ]; then echo "::error::Unallowlisted high/critical advisories:$bad"; exit 1; fi
          echo "OK — only the documented @auth/core (next-auth beta) advisories remain; accepted."
      - name: Secret scan
        run: |
          if grep -rnE "(api_key|secret|password|token)\s*[=:]\s*['\"][A-Za-z0-9+/_-]{16,}" \
             --include="*.ts" --include="*.tsx" --include="*.py" . \
             | grep -vE "environ|getenv|process\.env|headers|KEYNAME|x-aac|placeholder"; then
            echo "::error::Possible hardcoded secret"; exit 1
          fi

  uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: pip install pytest pytest-cov pgserver psycopg2-binary curl_cffi openpyxl anthropic pymupdf pdfplumber requests pandas lxml
      - run: npx playwright install --with-deps chromium
      - name: Full UAT (typecheck + build + pytest + browser journeys + a11y)
        run: npm run uat:all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: uat-report
          path: |
            uat-report/
            uat-results/
